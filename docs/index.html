<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de puesta a tierra</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#5d6677;--line:#dfe3ea;--acc:#1f5fbf;--ok:#16794a;--okbg:#e4f5ec;--bad:#b3261e;--badbg:#fdeceb;--warn:#8a5a00;--warnbg:#fff4de}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--ink:#e8ebf1;--mut:#9aa3b4;--line:#2d3340;--acc:#6ea2ff;--ok:#5fd39b;--okbg:#17332a;--bad:#ff8f87;--badbg:#3a1d1b;--warn:#f0c26a;--warnbg:#33290f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
header p{margin:0;color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;letter-spacing:.2px}
.row{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin:6px 0}
.row label{font-size:13.5px}
.row small{display:block;color:var(--mut);font-size:12px}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.row.full{grid-template-columns:1fr}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
#estado{color:var(--mut);font-size:13px;margin:4px 0 10px}
.banner{padding:12px 16px;border-radius:10px;font-weight:700;font-size:17px;margin-bottom:14px}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--mut);font-size:12.5px}
.ver{margin:10px 0}
.ver .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.gauge{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.gauge i{display:block;height:100%}
.tag{font-weight:700}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.f{color:var(--mut);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.hint{color:var(--mut);font-size:12.5px}
#cargando{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
svg text{fill:var(--mut);font-size:11px}
@media print{#cargando,.noprint,#form{display:none!important}main{display:block}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="cargando"><div class="spin"></div><div>Cargando el motor de cálculo…</div><div class="hint">La primera vez necesita internet (unos segundos).</div></div>
<header>
  <h1>Calculadora de puesta a tierra de subestaciones</h1>
  <p>Diseño de mallas según IEEE Std 80. Los cálculos corren en tu navegador; no se envía ningún dato.</p>
</header>
<main>
  <section id="form">
    <div class="bar noprint">
      <button class="primary" id="btnCalc">Calcular</button>
      <button id="btnEj">Cargar ejemplo</button>
      <button id="btnGuardar">Guardar datos</button>
      <button id="btnAbrir">Abrir datos…</button>
      <input type="file" id="archivo" accept=".json" hidden>
    </div>
    <div id="estado"></div>
    <div id="campos"></div>
  </section>
  <section id="resultados">
    <div class="card"><h2>Resultados</h2><p class="hint">Completa los datos a la izquierda y pulsa <b>Calcular</b>.</p></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const FUENTES = {"__init__.py": "\"\"\"Calculadora de puesta a tierra de subestaciones segun IEEE Std 80.\"\"\"\n\nfrom .diseno import barrido_conductores, evaluar, memoria_markdown\nfrom .malla import Malla\n\n__all__ = [\"evaluar\", \"barrido_conductores\", \"memoria_markdown\", \"Malla\"]\n__version__ = \"0.1.0\"\n", "api.py": "\"\"\"Interfaz JSON-in / JSON-out. La usa la pagina web (Pyodide) y sirve para scripts.\"\"\"\n\nimport json\n\nfrom . import diseno, suelo\n\n\ndef _responder(fn):\n    try:\n        return json.dumps(fn(), ensure_ascii=False)\n    except ValueError as e:\n        return json.dumps({\"error\": str(e)}, ensure_ascii=False)\n    except (KeyError, TypeError) as e:\n        return json.dumps({\"error\": f\"Dato faltante o con formato invalido: {e}\"}, ensure_ascii=False)\n\n\ndef calcular(json_entrada):\n    \"\"\"Evalua un diseno. Devuelve JSON con resultados + memoria en Markdown.\"\"\"\n\n    def _f():\n        datos = json.loads(json_entrada)\n        r = diseno.evaluar(datos)\n        r[\"memoria_md\"] = diseno.memoria_markdown(r)\n        return r\n\n    return _responder(_f)\n\n\ndef barrido(json_entrada, n_max=30):\n    def _f():\n        datos = json.loads(json_entrada)\n        filas, primero = diseno.barrido_conductores(datos, n_max)\n        return {\"filas\": filas, \"primer_n_que_cumple\": primero}\n\n    return _responder(_f)\n\n\ndef ajustar_suelo(json_entrada):\n    \"\"\"Entrada: {\"b\": 0, \"wenner\": [{\"a\":..,\"R\":..}, ...]}\"\"\"\n\n    def _f():\n        d = json.loads(json_entrada)\n        b = float(d.get(\"b\", 0) or 0)\n        med = [(float(x[\"a\"]), suelo.rho_aparente_wenner(float(x[\"a\"]), float(x[\"R\"]), b)) for x in d[\"wenner\"]]\n        res = suelo.ajustar_dos_capas(med)\n        res[\"promedio\"] = suelo.rho_promedio(med)\n        return res\n\n    return _responder(_f)\n\n\ndef ejemplo():\n    return json.dumps(diseno.ESQUEMA_EJEMPLO, ensure_ascii=False, indent=2)\n", "conductor.py": "\"\"\"Seccion minima del conductor de la malla (ecuacion de Onderdonk segun IEEE 80).\"\"\"\n\nimport math\n\nfrom .materiales import TEMP_MAX_UNION, obtener\n\n\ndef seccion_minima_mm2(i_ka, tc, material=\"cobre_duro\", ta=40.0, union=\"soldadura_exotermica\"):\n    \"\"\"Seccion minima [mm2] para que el conductor soporte la corriente i_ka [kA]\n    durante tc [s] sin superar la temperatura maxima admisible.\n\n        A = I / sqrt( (TCAP*1e-4)/(tc*alpha_r*rho_r) * ln((K0+Tm)/(K0+Ta)) )\n\n    i_ka : corriente eficaz simetrica que circula por el conductor [kA]\n    tc   : duracion de la corriente [s]\n    ta   : temperatura ambiente [C]\n    union: tipo de union que limita la temperatura (ver TEMP_MAX_UNION)\n    \"\"\"\n    if i_ka <= 0 or tc <= 0:\n        raise ValueError(\"La corriente y el tiempo del conductor deben ser positivos.\")\n    mat = obtener(material)\n    if union not in TEMP_MAX_UNION:\n        raise ValueError(f\"Tipo de union desconocido: '{union}'. Opciones: {', '.join(TEMP_MAX_UNION)}\")\n    tm = TEMP_MAX_UNION[union] or mat.tm\n    tm = min(tm, mat.tm)\n    if tm <= ta:\n        raise ValueError(\"La temperatura maxima admisible debe ser mayor que la ambiente.\")\n    factor = (mat.tcap * 1e-4) / (tc * mat.alpha_r * mat.rho_r) * math.log((mat.k0 + tm) / (mat.k0 + ta))\n    return i_ka / math.sqrt(factor)\n\n\ndef diametro_desde_seccion_mm(a_mm2):\n    return math.sqrt(4.0 * a_mm2 / math.pi)\n\n\ndef seccion_desde_diametro_mm2(d_mm):\n    return math.pi * d_mm**2 / 4.0\n", "diseno.py": "\"\"\"Orquestador: evalua un diseno completo de malla segun el flujo de IEEE 80.\n\nEntrada: diccionario (ver ejemplos/*.json). Salida: diccionario con resultados,\nverificaciones, advertencias y los pasos de la memoria de calculo.\n\"\"\"\n\nimport copy\nimport math\n\nfrom . import conductor as cond\nfrom . import falla, suelo, tolerables\nfrom .malla import Malla\n\nESQUEMA_EJEMPLO = {\n    \"proyecto\": \"Ejemplo didactico: malla 70 x 70 m con 20 varillas\",\n    \"suelo\": {\"rho\": 400.0},\n    \"capa_superficial\": {\"rho_s\": 2500.0, \"hs\": 0.102},\n    \"falla\": {\"i_falla_ka\": 3.18, \"sf\": 0.6, \"x_r\": 10.0, \"frecuencia\": 60.0, \"tf\": 0.5, \"cp\": 1.0},\n    \"descarga\": {\"ts\": 0.5, \"peso\": 70},\n    \"conductor\": {\"material\": \"cobre_duro\", \"ta\": 40.0, \"union\": \"soldadura_exotermica\", \"diametro_mm\": 10.0},\n    \"malla\": {\n        \"lx\": 70.0, \"ly\": 70.0, \"nx\": 11, \"ny\": 11, \"h\": 0.5,\n        \"varillas\": {\"cantidad\": 20, \"largo\": 7.5, \"diametro_mm\": 16.0, \"en_perimetro\": True},\n    },\n    \"metodo_rg\": \"sverak\",\n}\n\n\ndef _paso(simbolo, nombre, valor, unidad, formula=\"\"):\n    return {\"simbolo\": simbolo, \"nombre\": nombre, \"valor\": valor, \"unidad\": unidad, \"formula\": formula}\n\n\ndef _num(d, clave, defecto=None, minimo=None, nombre=None):\n    v = d.get(clave, defecto)\n    if v is None:\n        raise ValueError(f\"Falta el dato '{nombre or clave}'.\")\n    try:\n        v = float(v)\n    except (TypeError, ValueError):\n        raise ValueError(f\"El dato '{nombre or clave}' debe ser un numero.\") from None\n    if not math.isfinite(v):\n        raise ValueError(f\"El dato '{nombre or clave}' no es un numero finito.\")\n    if minimo is not None and v <= minimo:\n        raise ValueError(f\"El dato '{nombre or clave}' debe ser mayor que {minimo:g}.\")\n    return v\n\n\ndef _construir_malla(m, d_mm):\n    v = m.get(\"varillas\") or {}\n    cantidad = int(_num(v, \"cantidad\", 0, nombre=\"varillas.cantidad\") if v else 0)\n    return Malla.rectangular(\n        lx=_num(m, \"lx\", minimo=0, nombre=\"malla.lx\"),\n        ly=_num(m, \"ly\", minimo=0, nombre=\"malla.ly\"),\n        nx=int(_num(m, \"nx\", minimo=1, nombre=\"malla.nx\")),\n        ny=int(_num(m, \"ny\", minimo=1, nombre=\"malla.ny\")),\n        h=_num(m, \"h\", minimo=0, nombre=\"malla.h\"),\n        d=d_mm / 1000.0,\n        n_varillas=cantidad,\n        l_varilla=_num(v, \"largo\", 0.0, nombre=\"varillas.largo\") if cantidad else 0.0,\n        d_varilla=_num(v, \"diametro_mm\", 16.0, nombre=\"varillas.diametro_mm\") / 1000.0,\n        varillas_perimetro=bool(v.get(\"en_perimetro\", True)),\n    )\n\n\ndef evaluar(datos):\n    \"\"\"Evalua el diseno. Lanza ValueError con mensaje en espanol si hay datos invalidos.\"\"\"\n    datos = copy.deepcopy(datos)\n    pasos, advertencias, extra = [], [], {}\n\n    # ---- suelo --------------------------------------------------------\n    s = datos.get(\"suelo\") or {}\n    if \"wenner\" in s and s[\"wenner\"]:\n        b = float(s.get(\"b\", 0.0) or 0.0)\n        med = []\n        for fila in s[\"wenner\"]:\n            a, r = _num(fila, \"a\", minimo=0, nombre=\"wenner.a\"), _num(fila, \"R\", minimo=0, nombre=\"wenner.R\")\n            med.append((a, suelo.rho_aparente_wenner(a, r, b)))\n        rho = float(s[\"rho\"]) if s.get(\"rho\") else suelo.rho_promedio(med)\n        extra[\"mediciones_rho_a\"] = [{\"a\": a, \"rho_a\": r} for a, r in med]\n        if len(med) >= 3:\n            try:\n                extra[\"modelo_dos_capas\"] = suelo.ajustar_dos_capas(med)\n            except ValueError:\n                pass\n        origen = \"promedio de las resistividades aparentes Wenner\" if not s.get(\"rho\") else \"valor ingresado por el usuario\"\n        pasos.append(_paso(\"rho\", f\"Resistividad de diseno ({origen})\", rho, \"ohm*m\", \"rho = promedio(rho_a)\"))\n    else:\n        rho = _num(s, \"rho\", minimo=0, nombre=\"suelo.rho\")\n        pasos.append(_paso(\"rho\", \"Resistividad del suelo\", rho, \"ohm*m\", \"dato\"))\n\n    cs_ = datos.get(\"capa_superficial\") or {}\n    rho_s = float(cs_[\"rho_s\"]) if cs_.get(\"rho_s\") else None\n    hs = float(cs_.get(\"hs\", 0.0) or 0.0)\n\n    # ---- falla --------------------------------------------------------\n    f = datos.get(\"falla\") or {}\n    tf = _num(f, \"tf\", minimo=0, nombre=\"falla.tf\")\n    x_r = _num(f, \"x_r\", 0.0, nombre=\"falla.x_r\")\n    frec = _num(f, \"frecuencia\", 60.0, minimo=0, nombre=\"falla.frecuencia\")\n    sf = _num(f, \"sf\", 1.0, minimo=0, nombre=\"falla.sf\")\n    cp = _num(f, \"cp\", 1.0, minimo=0, nombre=\"falla.cp\")\n    i_falla = _num(f, \"i_falla_ka\", minimo=0, nombre=\"falla.i_falla_ka\")\n    ta = falla.constante_tiempo_dc(x_r, frec)\n    df = falla.factor_decremento(tf, x_r, frec)\n    ig = falla.corriente_malla(i_falla, sf, df, cp)\n    pasos += [\n        _paso(\"Ta\", \"Constante de tiempo DC\", ta, \"s\", \"Ta = (X/R)/(2 pi f)\"),\n        _paso(\"Df\", \"Factor de decremento\", df, \"-\", \"Df = sqrt(1 + Ta/tf (1 - exp(-2 tf/Ta)))\"),\n        _paso(\"IG\", \"Corriente maxima de malla\", ig, \"A\", \"IG = Cp * Df * Sf * If\"),\n    ]\n\n    # ---- descarga y tensiones tolerables ------------------------------\n    de = datos.get(\"descarga\") or {}\n    ts = _num(de, \"ts\", tf, minimo=0, nombre=\"descarga.ts\")\n    peso = int(_num(de, \"peso\", 70, nombre=\"descarga.peso\"))\n    cs, e_paso_t, e_cont_t = tolerables.tensiones_tolerables(rho, ts, peso, rho_s, hs)\n    pasos += [\n        _paso(\"Cs\", \"Factor de capa superficial\", cs, \"-\", \"Cs = 1 - 0.09 (1 - rho/rho_s)/(2 hs + 0.09)\"),\n        _paso(\"E_paso,tol\", f\"Tension de paso tolerable ({peso} kg)\", e_paso_t, \"V\", \"(1000 + 6 Cs rho_s) k / sqrt(ts)\"),\n        _paso(\"E_cont,tol\", f\"Tension de contacto tolerable ({peso} kg)\", e_cont_t, \"V\", \"(1000 + 1.5 Cs rho_s) k / sqrt(ts)\"),\n    ]\n\n    # ---- conductor ----------------------------------------------------\n    c = datos.get(\"conductor\") or {}\n    material = c.get(\"material\", \"cobre_duro\")\n    ta_amb = _num(c, \"ta\", 40.0, nombre=\"conductor.ta\")\n    tc = _num(c, \"tc\", tf, minimo=0, nombre=\"conductor.tc\")\n    union = c.get(\"union\", \"soldadura_exotermica\")\n    d_mm = _num(c, \"diametro_mm\", minimo=0, nombre=\"conductor.diametro_mm\")\n    # Criterio conservador: el conductor se dimensiona con la corriente de falla\n    # completa 3I0 (sin factor de division Sf), porque un conductor puede quedar\n    # en serie con toda la corriente de falla.\n    a_min = cond.seccion_minima_mm2(i_falla, tc, material, ta_amb, union)\n    d_min = cond.diametro_desde_seccion_mm(a_min)\n    a_real = cond.seccion_desde_diametro_mm2(d_mm)\n    pasos += [\n        _paso(\"A_min\", \"Seccion minima del conductor\", a_min, \"mm2\",\n              \"A = I / sqrt((TCAP 1e-4)/(tc alpha_r rho_r) ln((K0+Tm)/(K0+Ta)))\"),\n        _paso(\"d_min\", \"Diametro minimo equivalente\", d_min, \"mm\", \"d = sqrt(4 A / pi)\"),\n    ]\n\n    # ---- malla --------------------------------------------------------\n    malla = _construir_malla(datos.get(\"malla\") or {}, d_mm)\n    advertencias += malla.advertencias()\n    metodo = datos.get(\"metodo_rg\", \"sverak\")\n    rg_sv = malla.rg_sverak(rho)\n    rg_sw = malla.rg_schwarz(rho)\n    rg = rg_sw if metodo == \"schwarz\" else rg_sv\n    em = malla.tension_malla(rho, ig)\n    es = malla.tension_paso(rho, ig)\n    gpr = ig * rg\n    pasos += [\n        _paso(\"A\", \"Area de la malla\", malla.area, \"m2\", \"A = Lx Ly\"),\n        _paso(\"Lc\", \"Longitud de conductor horizontal\", malla.lc, \"m\", \"Lc = nx Lx + ny Ly\"),\n        _paso(\"LR\", \"Longitud total de varillas\", malla.lr_total, \"m\", \"LR = N_var * L_var\"),\n        _paso(\"LT\", \"Longitud total enterrada\", malla.lt, \"m\", \"LT = Lc + LR\"),\n        _paso(\"D\", \"Espaciamiento entre conductores\", malla.d_sep, \"m\", \"promedio de los espaciamientos\"),\n        _paso(\"Rg (Sverak)\", \"Resistencia de malla\", rg_sv, \"ohm\", \"rho [1/LT + 1/sqrt(20A) (1 + 1/(1+h sqrt(20/A)))]\"),\n        _paso(\"Rg (Schwarz)\", \"Resistencia de malla (verificacion)\", rg_sw, \"ohm\", \"(R1 R2 - Rm^2)/(R1 + R2 - 2 Rm)\"),\n        _paso(\"GPR\", \"Elevacion de potencial de tierra\", gpr, \"V\", \"GPR = IG Rg\"),\n        _paso(\"n\", \"Numero efectivo de conductores\", malla.n, \"-\", \"n = na nb nc nd\"),\n        _paso(\"Ki\", \"Factor de irregularidad\", malla.ki, \"-\", \"Ki = 0.644 + 0.148 n\"),\n        _paso(\"Kii\", \"Factor de correccion por electrodos\", malla.kii, \"-\", \"1 con varillas perimetrales; si no 1/(2n)^(2/n)\"),\n        _paso(\"Kh\", \"Factor de profundidad\", malla.kh, \"-\", \"Kh = sqrt(1 + h/h0)\"),\n        _paso(\"Km\", \"Factor geometrico de malla\", malla.km, \"-\", \"ver IEEE 80\"),\n        _paso(\"Ks\", \"Factor geometrico de paso\", malla.ks, \"-\", \"ver IEEE 80\"),\n        _paso(\"LM\", \"Longitud efectiva para tension de malla\", malla.lm, \"m\", \"Lc + [1.55 + 1.22 Lr/sqrt(Lx^2+Ly^2)] LR\"),\n        _paso(\"Ls\", \"Longitud efectiva para tension de paso\", malla.ls, \"m\", \"Ls = 0.75 Lc + 0.85 LR\"),\n        _paso(\"Em\", \"Tension de malla\", em, \"V\", \"Em = rho Km Ki IG / LM\"),\n        _paso(\"Es\", \"Tension de paso\", es, \"V\", \"Es = rho Ks Ki IG / Ls\"),\n    ]\n\n    # ---- verificaciones -----------------------------------------------\n    verif = [\n        {\"nombre\": \"Seccion del conductor\", \"valor\": a_real, \"limite\": a_min, \"unidad\": \"mm2\",\n         \"cumple\": a_real >= a_min, \"criterio\": \"A_real >= A_min\"},\n        {\"nombre\": \"Tension de malla\", \"valor\": em, \"limite\": e_cont_t, \"unidad\": \"V\",\n         \"cumple\": em <= e_cont_t, \"criterio\": \"Em <= E_contacto,tol\"},\n        {\"nombre\": \"Tension de paso\", \"valor\": es, \"limite\": e_paso_t, \"unidad\": \"V\",\n         \"cumple\": es <= e_paso_t, \"criterio\": \"Es <= E_paso,tol\"},\n    ]\n    gpr_ok = gpr <= e_cont_t\n    info_gpr = (\"GPR <= E_contacto,tol: la malla cumple sin mas analisis (criterio de diseno inicial).\"\n                if gpr_ok else \"GPR > E_contacto,tol: se requiere verificar Em y Es (ya evaluados arriba).\")\n\n    return {\n        \"proyecto\": datos.get(\"proyecto\", \"\"),\n        \"metodo_rg\": metodo,\n        \"rho\": rho, \"cs\": cs, \"df\": df, \"ig_a\": ig, \"gpr_v\": gpr, \"rg_ohm\": rg,\n        \"rg_sverak\": rg_sv, \"rg_schwarz\": rg_sw,\n        \"e_malla\": em, \"e_paso\": es, \"e_contacto_tol\": e_cont_t, \"e_paso_tol\": e_paso_t,\n        \"a_min_mm2\": a_min, \"d_min_mm\": d_min,\n        \"n\": malla.n, \"km\": malla.km, \"ks\": malla.ks, \"ki\": malla.ki,\n        \"verificaciones\": verif,\n        \"cumple\": all(v[\"cumple\"] for v in verif),\n        \"nota_gpr\": info_gpr,\n        \"advertencias\": advertencias,\n        \"pasos\": pasos,\n        \"extra\": extra,\n    }\n\n\ndef barrido_conductores(datos, n_max=40):\n    \"\"\"Evalua el diseno variando nx = ny entre 3 y n_max. Devuelve lista de filas\n    {n_conductores, em, es, rg, cumple, valida} y el primer n que cumple con\n    geometria valida (o None).\"\"\"\n    filas, primero = [], None\n    for n in range(3, int(n_max) + 1):\n        d = copy.deepcopy(datos)\n        d[\"malla\"][\"nx\"] = n\n        d[\"malla\"][\"ny\"] = n\n        try:\n            r = evaluar(d)\n        except ValueError:\n            continue\n        # Km/Ks solo son validos con D > 2.5 m: esas filas se muestran pero no se proponen.\n        valida = not any(\"espaciamiento\" in a for a in r[\"advertencias\"])\n        ok = r[\"cumple\"]\n        filas.append({\"n_conductores\": n, \"em\": r[\"e_malla\"], \"es\": r[\"e_paso\"], \"rg\": r[\"rg_ohm\"],\n                      \"cumple\": ok, \"valida\": valida})\n        if ok and valida and primero is None:\n            primero = n\n    return filas, primero\n\n\ndef memoria_markdown(r):\n    \"\"\"Memoria de calculo en Markdown a partir del resultado de evaluar().\"\"\"\n    L = []\n    L.append(f\"# Memoria de calculo de malla de puesta a tierra\")\n    if r.get(\"proyecto\"):\n        L.append(f\"\\n**Proyecto:** {r['proyecto']}\")\n    L.append(\"\\nMetodologia: IEEE Std 80. Calculado con la calculadora de puesta a tierra (repositorio del libro).\\n\")\n    L.append(\"## Pasos de calculo\\n\")\n    L.append(\"| Simbolo | Descripcion | Valor | Unidad | Expresion |\")\n    L.append(\"|---|---|---:|---|---|\")\n    for p in r[\"pasos\"]:\n        v = p[\"valor\"]\n        txt = f\"{v:,.4f}\" if abs(v) < 1000 else f\"{v:,.1f}\"\n        L.append(f\"| {p['simbolo']} | {p['nombre']} | {txt} | {p['unidad']} | {p['formula']} |\")\n    L.append(\"\\n## Verificaciones\\n\")\n    L.append(\"| Verificacion | Valor | Limite | Criterio | Resultado |\")\n    L.append(\"|---|---:|---:|---|---|\")\n    for v in r[\"verificaciones\"]:\n        L.append(f\"| {v['nombre']} | {v['valor']:,.2f} {v['unidad']} | {v['limite']:,.2f} {v['unidad']} | {v['criterio']} | {'CUMPLE' if v['cumple'] else 'NO CUMPLE'} |\")\n    L.append(f\"\\n{r['nota_gpr']}\")\n    L.append(f\"\\n**Conclusion: {'EL DISENO CUMPLE' if r['cumple'] else 'EL DISENO NO CUMPLE'}**\")\n    if r[\"advertencias\"]:\n        L.append(\"\\n## Advertencias\\n\")\n        for a in r[\"advertencias\"]:\n            L.append(f\"- {a}\")\n    return \"\\n\".join(L) + \"\\n\"\n", "falla.py": "\"\"\"Corriente de falla, factor de decremento y corriente de malla (IEEE 80).\"\"\"\n\nimport math\n\n\ndef constante_tiempo_dc(x_r, f=60.0):\n    \"\"\"Ta = (X/R) / (2 pi f)  [s]\"\"\"\n    if x_r < 0 or f <= 0:\n        raise ValueError(\"X/R no puede ser negativo y la frecuencia debe ser positiva.\")\n    return x_r / (2.0 * math.pi * f)\n\n\ndef factor_decremento(tf, x_r, f=60.0):\n    \"\"\"Factor de decremento Df para una falla de duracion tf [s].\n\n        Df = sqrt( 1 + (Ta/tf) (1 - exp(-2 tf/Ta)) )\n    \"\"\"\n    if tf <= 0:\n        raise ValueError(\"La duracion de la falla tf debe ser positiva.\")\n    ta = constante_tiempo_dc(x_r, f)\n    if ta == 0:\n        return 1.0\n    return math.sqrt(1.0 + (ta / tf) * (1.0 - math.exp(-2.0 * tf / ta)))\n\n\ndef corriente_falla_monofasica(v_ll_kv, z1, z2, z0, rf=0.0):\n    \"\"\"Falla monofasica a tierra. Devuelve (3I0 [kA], X/R de la secuencia total).\n\n    z1, z2, z0: impedancias de secuencia [ohm] (numeros complejos o reales)\n    rf: resistencia de falla [ohm]\n        3I0 = 3 E / (Z1 + Z2 + Z0 + 3 Rf),  E = V_ll / sqrt(3)\n    \"\"\"\n    if v_ll_kv <= 0:\n        raise ValueError(\"La tension de linea debe ser positiva.\")\n    z = complex(z1) + complex(z2) + complex(z0) + 3.0 * rf\n    if abs(z) == 0:\n        raise ValueError(\"La impedancia total no puede ser cero.\")\n    i_ka = math.sqrt(3.0) * v_ll_kv / abs(z)\n    x_r = abs(z.imag) / z.real if z.real > 0 else float(\"inf\")\n    return i_ka, x_r\n\n\ndef corriente_malla(i_falla_ka, sf=1.0, df=1.0, cp=1.0):\n    \"\"\"Corriente maxima de malla IG [A].\n\n        IG = Cp * Df * Sf * If\n\n    i_falla_ka: corriente simetrica de falla a tierra 3I0 [kA]\n    sf: factor de division de corriente de falla (0..1)\n    df: factor de decremento\n    cp: factor de proyeccion de crecimiento del sistema (>= 1)\n    \"\"\"\n    if i_falla_ka <= 0:\n        raise ValueError(\"La corriente de falla debe ser positiva.\")\n    if not (0 < sf <= 1):\n        raise ValueError(\"El factor de division Sf debe estar entre 0 y 1.\")\n    if cp < 1:\n        raise ValueError(\"El factor de crecimiento Cp debe ser >= 1.\")\n    return cp * df * sf * i_falla_ka * 1000.0\n", "malla.py": "\"\"\"Geometria y ecuaciones de la malla de puesta a tierra (IEEE 80).\n\nTodas las longitudes en metros, resistividades en ohm*m, corrientes en A.\n\"\"\"\n\nimport math\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Malla:\n    \"\"\"Geometria de la malla. Para mallas rectangulares usar Malla.rectangular().\"\"\"\n\n    area: float  # A  [m2]\n    perimetro: float  # Lp [m]\n    lc: float  # longitud total de conductor horizontal [m]\n    lx: float  # dimension maxima en x [m]\n    ly: float  # dimension maxima en y [m]\n    dm: float  # distancia maxima entre dos puntos de la malla [m]\n    d_sep: float  # espaciamiento entre conductores paralelos D [m]\n    h: float  # profundidad de enterramiento [m]\n    d: float  # diametro del conductor [m]\n    n_varillas: int = 0\n    l_varilla: float = 0.0  # longitud de cada varilla [m]\n    d_varilla: float = 0.016  # diametro de varilla [m]\n    varillas_perimetro: bool = True  # varillas en esquinas/perimetro\n    nx_cond: int = 0  # conductores paralelos a x (0 = geometria no rectangular)\n    ny_cond: int = 0  # conductores paralelos a y\n\n    # ---- constructores -------------------------------------------------\n    @classmethod\n    def rectangular(cls, lx, ly, nx, ny, h, d, n_varillas=0, l_varilla=0.0,\n                    d_varilla=0.016, varillas_perimetro=True):\n        \"\"\"Malla rectangular lx x ly con nx conductores paralelos a x y ny paralelos a y.\n\n        D se toma como el promedio de los dos espaciamientos.\n        \"\"\"\n        if nx < 2 or ny < 2:\n            raise ValueError(\"Se necesitan al menos 2 conductores en cada direccion.\")\n        dx = lx / (ny - 1)\n        dy = ly / (nx - 1)\n        return cls(\n            area=lx * ly,\n            perimetro=2.0 * (lx + ly),\n            lc=nx * lx + ny * ly,\n            lx=lx,\n            ly=ly,\n            dm=math.hypot(lx, ly),\n            d_sep=(dx + dy) / 2.0,\n            h=h,\n            d=d,\n            n_varillas=n_varillas,\n            l_varilla=l_varilla,\n            d_varilla=d_varilla,\n            varillas_perimetro=varillas_perimetro,\n            nx_cond=nx,\n            ny_cond=ny,\n        )\n\n    def __post_init__(self):\n        for nombre in (\"area\", \"perimetro\", \"lc\", \"lx\", \"ly\", \"dm\", \"d_sep\", \"h\", \"d\"):\n            if getattr(self, nombre) <= 0:\n                raise ValueError(f\"El parametro de malla '{nombre}' debe ser positivo.\")\n        if self.n_varillas < 0:\n            raise ValueError(\"El numero de varillas no puede ser negativo.\")\n        if self.n_varillas > 0 and (self.l_varilla <= 0 or self.d_varilla <= 0):\n            raise ValueError(\"Con varillas, su longitud y diametro deben ser positivos.\")\n\n    # ---- magnitudes derivadas -----------------------------------------\n    @property\n    def lr_total(self):\n        \"\"\"LR: longitud total de varillas [m].\"\"\"\n        return self.n_varillas * self.l_varilla\n\n    @property\n    def lt(self):\n        \"\"\"LT = Lc + LR [m].\"\"\"\n        return self.lc + self.lr_total\n\n    @property\n    def n(self):\n        \"\"\"Numero efectivo de conductores paralelos n = na nb nc nd.\"\"\"\n        na = 2.0 * self.lc / self.perimetro\n        nb = math.sqrt(self.perimetro / (4.0 * math.sqrt(self.area)))\n        nc = (self.lx * self.ly / self.area) ** (0.7 * self.area / (self.lx * self.ly))\n        nd = self.dm / math.hypot(self.lx, self.ly)\n        return na * nb * nc * nd\n\n    @property\n    def lm(self):\n        \"\"\"Longitud efectiva LM para la tension de malla [m].\"\"\"\n        if self.n_varillas > 0 and self.varillas_perimetro:\n            return self.lc + (1.55 + 1.22 * self.l_varilla / math.hypot(self.lx, self.ly)) * self.lr_total\n        return self.lc + self.lr_total\n\n    @property\n    def ls(self):\n        \"\"\"Longitud efectiva Ls para la tension de paso [m].\"\"\"\n        return 0.75 * self.lc + 0.85 * self.lr_total\n\n    # ---- factores geometricos -----------------------------------------\n    @property\n    def ki(self):\n        \"\"\"Factor de correccion de irregularidad Ki = 0.644 + 0.148 n.\"\"\"\n        return 0.644 + 0.148 * self.n\n\n    @property\n    def kii(self):\n        \"\"\"Kii = 1 con varillas en esquinas/perimetro; si no, 1/(2n)^(2/n).\"\"\"\n        if self.n_varillas > 0 and self.varillas_perimetro:\n            return 1.0\n        n = self.n\n        return 1.0 / (2.0 * n) ** (2.0 / n)\n\n    @property\n    def kh(self):\n        \"\"\"Kh = sqrt(1 + h/h0), h0 = 1 m.\"\"\"\n        return math.sqrt(1.0 + self.h / 1.0)\n\n    @property\n    def km(self):\n        \"\"\"Factor geometrico para la tension de malla.\"\"\"\n        D, h, d, n = self.d_sep, self.h, self.d, self.n\n        termino1 = math.log(D**2 / (16.0 * h * d) + (D + 2.0 * h) ** 2 / (8.0 * D * d) - h / (4.0 * d))\n        termino2 = (self.kii / self.kh) * math.log(8.0 / (math.pi * (2.0 * n - 1.0)))\n        return (termino1 + termino2) / (2.0 * math.pi)\n\n    @property\n    def ks(self):\n        \"\"\"Factor geometrico para la tension de paso (h entre 0.25 y 2.5 m).\"\"\"\n        D, h, n = self.d_sep, self.h, self.n\n        return (1.0 / math.pi) * (1.0 / (2.0 * h) + 1.0 / (D + h) + (1.0 / D) * (1.0 - 0.5 ** (n - 2.0)))\n\n    # ---- resistencia de la malla --------------------------------------\n    def rg_sverak(self, rho):\n        \"\"\"Resistencia de malla, ecuacion de Sverak [ohm].\"\"\"\n        A, h, lt = self.area, self.h, self.lt\n        return rho * (1.0 / lt + (1.0 / math.sqrt(20.0 * A)) * (1.0 + 1.0 / (1.0 + h * math.sqrt(20.0 / A))))\n\n    def _k1k2(self):\n        \"\"\"Coeficientes de Schwarz, interpolados segun h/sqrt(A) entre 0, 1/10 y 1/6.\"\"\"\n        x = self.lx / self.ly  # relacion de lados Lx/Ly\n        t = self.h / math.sqrt(self.area)\n        puntos = [\n            (0.0, -0.04 * x + 1.41, 0.15 * x + 5.50),\n            (0.1, -0.05 * x + 1.20, 0.10 * x + 4.68),\n            (1.0 / 6.0, -0.05 * x + 1.13, 0.10 * x + 4.40),\n        ]\n        if t <= puntos[0][0]:\n            return puntos[0][1], puntos[0][2]\n        if t >= puntos[-1][0]:\n            return puntos[-1][1], puntos[-1][2]\n        for (t0, a0, b0), (t1, a1, b1) in zip(puntos, puntos[1:]):\n            if t0 <= t <= t1:\n                f = (t - t0) / (t1 - t0)\n                return a0 + f * (a1 - a0), b0 + f * (b1 - b0)\n\n    def rg_schwarz(self, rho):\n        \"\"\"Resistencia de malla con varillas, ecuaciones de Schwarz [ohm].\n\n        Comprobacion cruzada de Sverak. Los coeficientes k1, k2 se publican para\n        h = 0, h = sqrt(A)/10 y h = sqrt(A)/6; aqui se interpolan linealmente.\n        \"\"\"\n        A = self.area\n        r_cond = self.d / 2.0\n        a_eq = math.sqrt(r_cond * 2.0 * self.h)  # a' = sqrt(a * 2h) conductor enterrado\n        k1, k2 = self._k1k2()\n        lc = self.lc\n        r1 = rho / (math.pi * lc) * (math.log(2.0 * lc / a_eq) + k1 * lc / math.sqrt(A) - k2)\n        if self.n_varillas == 0:\n            return r1\n        nr, lr = self.n_varillas, self.l_varilla\n        b = self.d_varilla\n        r2 = rho / (2.0 * math.pi * nr * lr) * (\n            math.log(4.0 * lr / b) - 1.0 + 2.0 * k1 * lr / math.sqrt(A) * (math.sqrt(nr) - 1.0) ** 2\n        )\n        rm = rho / (math.pi * lc) * (math.log(2.0 * lc / lr) + k1 * lc / math.sqrt(A) - k2 + 1.0)\n        return (r1 * r2 - rm**2) / (r1 + r2 - 2.0 * rm)\n\n    # ---- tensiones ----------------------------------------------------\n    def tension_malla(self, rho, ig):\n        \"\"\"Tension de malla Em = rho Km Ki IG / LM [V].\"\"\"\n        return rho * self.km * self.ki * ig / self.lm\n\n    def tension_paso(self, rho, ig):\n        \"\"\"Tension de paso Es = rho Ks Ki IG / Ls [V].\"\"\"\n        return rho * self.ks * self.ki * ig / self.ls\n\n    def advertencias(self):\n        \"\"\"Limites de validez de las ecuaciones de Km/Ks y avisos geometricos.\"\"\"\n        av = []\n        if not (0.25 <= self.h <= 2.5):\n            av.append(f\"La profundidad h = {self.h:g} m esta fuera del rango 0.25-2.5 m de validez de Km/Ks.\")\n        if self.d_sep <= 2.5:\n            av.append(f\"El espaciamiento D = {self.d_sep:g} m es menor o igual que 2.5 m, fuera del rango de validez de Km/Ks.\")\n        if self.d >= 0.25 * self.d_sep:\n            av.append(\"El diametro del conductor excede 0.25 D: fuera del rango de validez de Km.\")\n        if self.lx > 0 and self.ly > 0 and max(self.lx, self.ly) / min(self.lx, self.ly) > 3:\n            av.append(\"Relacion de lados mayor que 3: Rg (Sverak) y los factores geometricos pierden precision.\")\n        return av\n", "materiales.py": "\"\"\"Constantes de materiales para el dimensionamiento del conductor de la malla.\n\nFuente de los valores: IEEE Std 80-2013, tabla de constantes de materiales\n(alpha_r, K0, Tm, rho_r, TCAP). IMPORTANTE: contrastar cada valor con la\nedicion de la norma que se cite en el libro antes de publicar; los valores\nestan centralizados aqui para que una correccion se haga en un solo lugar.\n\"\"\"\n\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Material:\n    clave: str\n    nombre: str\n    alpha_r: float  # coeficiente termico de resistividad a 20 C [1/C]\n    k0: float  # 1/alpha_0 o (1/alpha_r - 20) a 0 C [C]\n    tm: float  # temperatura de fusion [C]\n    rho_r: float  # resistividad a 20 C [micro-ohm*cm]\n    tcap: float  # capacidad termica por unidad de volumen [J/(cm3*C)]\n\n\n_LISTA = [\n    Material(\"cobre_blando\", \"Cobre recocido trefilado blando (100 %)\", 0.00393, 234.0, 1083.0, 1.72, 3.42),\n    Material(\"cobre_duro\", \"Cobre trefilado duro comercial (97 %)\", 0.00381, 242.0, 1084.0, 1.78, 3.42),\n    Material(\"cobre_acero_40\", \"Alambre acero recubierto de cobre 40 %\", 0.00378, 245.0, 1084.0, 4.40, 3.846),\n    Material(\"cobre_acero_30\", \"Alambre acero recubierto de cobre 30 %\", 0.00378, 245.0, 1084.0, 5.86, 3.846),\n    Material(\"cobre_acero_20\", \"Varilla acero recubierta de cobre 20 %\", 0.00378, 245.0, 1084.0, 8.62, 3.846),\n    Material(\"aluminio_ec\", \"Aluminio grado EC\", 0.00403, 228.0, 657.0, 2.86, 2.556),\n    Material(\"aluminio_5005\", \"Aluminio aleacion 5005\", 0.00353, 263.0, 652.0, 3.22, 2.598),\n    Material(\"aluminio_6201\", \"Aluminio aleacion 6201\", 0.00347, 268.0, 654.0, 3.28, 2.598),\n    Material(\"aluminio_acero_20\", \"Acero recubierto de aluminio 20.3 %\", 0.00360, 258.0, 657.0, 8.48, 3.58),\n    Material(\"acero_1020\", \"Acero 1020\", 0.00160, 605.0, 1510.0, 15.90, 3.28),\n    Material(\"acero_inox_recub_20\", \"Acero recubierto de acero inoxidable 20.3 %\", 0.00160, 605.0, 1400.0, 17.50, 3.28),\n    Material(\"acero_zincado\", \"Varilla de acero cincada (galvanizada)\", 0.00320, 293.0, 419.0, 72.00, 3.931),\n    Material(\"acero_inox_304\", \"Acero inoxidable 304\", 0.00130, 749.0, 1400.0, 72.00, 4.032),\n]\n\nMATERIALES = {m.clave: m for m in _LISTA}\n\n# Temperatura maxima admisible segun el tipo de union (C). None = usar Tm del conductor.\nTEMP_MAX_UNION = {\n    \"soldadura_exotermica\": None,\n    \"soldadura_fuerte\": 450.0,\n    \"conector_mecanico\": 250.0,\n}\n\n\ndef obtener(clave: str) -> Material:\n    try:\n        return MATERIALES[clave]\n    except KeyError:\n        raise ValueError(\n            f\"Material desconocido: '{clave}'. Opciones: {', '.join(MATERIALES)}\"\n        ) from None\n", "potencial.py": "\"\"\"Perfil de potencial superficial de una malla enterrada.\n\nPara que IEEE 80 compare la tension de toque hay que conocer el potencial de la\nsuperficie donde la persona apoya los pies. Em y Es del metodo simplificado solo\ndescriben el INTERIOR de la malla: no sirven para el cerco, la puerta ni el suelo\nexterior. Este modulo calcula el potencial en cualquier punto de la superficie y,\ncon el, las tensiones de toque y de paso en posiciones accesibles concretas.\n\nMODELO (leer antes de usar los resultados)\n\nSuelo uniforme de resistividad rho en un semiespacio. La malla se divide en\nsegmentos rectos; cada uno fuga al terreno una corriente desconocida I_j con\ndensidad uniforme a lo largo del propio segmento. Se impone la condicion fisica\nque el metodo de densidad uniforme omite: TODOS los segmentos estan al mismo\npotencial V, porque el cobre los une.\n\n    suma_j  Z_ij I_j = V        para cada segmento i\n    suma_j  I_j      = IG\n\nZ_ij es el potencial que aparece en el centro del segmento i por unidad de\ncorriente fugada por el segmento j, calculado con el metodo de imagenes respecto\nde la superficie del terreno:\n\n    Z_ij = (rho / 4 pi L_j) * [ int_j ds/r + int_j ds/r' ]\n\ncon r la distancia al segmento real y r' la distancia a su imagen. Para un\nsegmento recto la integral tiene forma cerrada con asinh. El sistema es lineal y\nse resuelve de una vez; de su solucion salen a la vez la resistencia de la malla\n(Rg = V / IG) y el potencial de cualquier punto de la superficie.\n\nEste planteamiento es el metodo analitico clasico de analisis de mallas. Que\nentregue una Rg proxima a la de Sverak es su comprobacion de coherencia: ver\ndocs/VALIDACION.md.\n\nLIMITES. Suelo uniforme: no modela dos capas. No incluye el acoplamiento\ninductivo ni la impedancia longitudinal del conductor, por lo que corresponde a\nun modelo resistivo de baja frecuencia. No sustituye al metodo simplificado de\nIEEE 80 para el interior: lo complementa en las posiciones que el metodo no\ncubre. Las comprobaciones del interior se siguen haciendo con Em y Es.\n\"\"\"\n\nimport math\nfrom dataclasses import dataclass\n\ntry:  # numpy acelera el sistema lineal; el modulo funciona sin el\n    import numpy as _np\nexcept ImportError:  # pragma: no cover\n    _np = None\n\nRADIO_POR_DEFECTO = 0.00525  # m (conductor de 10.5 mm de diametro)\n\n\n@dataclass(frozen=True)\nclass Segmento:\n    \"\"\"Segmento recto enterrado. z negativo = bajo la superficie.\"\"\"\n\n    x1: float\n    y1: float\n    z1: float\n    x2: float\n    y2: float\n    z2: float\n\n    @property\n    def longitud(self):\n        return math.sqrt((self.x2 - self.x1) ** 2 + (self.y2 - self.y1) ** 2\n                         + (self.z2 - self.z1) ** 2)\n\n    @property\n    def centro(self):\n        return ((self.x1 + self.x2) / 2.0, (self.y1 + self.y2) / 2.0, (self.z1 + self.z2) / 2.0)\n\n    def subdividir(self, n):\n        out = []\n        for k in range(n):\n            f0, f1 = k / n, (k + 1) / n\n            out.append(Segmento(\n                self.x1 + (self.x2 - self.x1) * f0, self.y1 + (self.y2 - self.y1) * f0,\n                self.z1 + (self.z2 - self.z1) * f0,\n                self.x1 + (self.x2 - self.x1) * f1, self.y1 + (self.y2 - self.y1) * f1,\n                self.z1 + (self.z2 - self.z1) * f1))\n        return out\n\n\ndef _integral(seg, px, py, pz, a_min):\n    \"\"\"int_0^L ds / r desde el punto (px, py, pz) hasta el segmento.\"\"\"\n    L = seg.longitud\n    if L <= 0:\n        return 0.0\n    ux, uy, uz = (seg.x2 - seg.x1) / L, (seg.y2 - seg.y1) / L, (seg.z2 - seg.z1) / L\n    wx, wy, wz = px - seg.x1, py - seg.y1, pz - seg.z1\n    t0 = wx * ux + wy * uy + wz * uz\n    d2 = (wx * wx + wy * wy + wz * wz) - t0 * t0\n    d = math.sqrt(max(d2, a_min * a_min))\n    return math.asinh((L - t0) / d) + math.asinh(t0 / d)\n\n\ndef _coef(seg, rho, px, py, pz, a_min):\n    \"\"\"Potencial en (px, py, pz) por unidad de corriente fugada por el segmento.\"\"\"\n    L = seg.longitud\n    img = Segmento(seg.x1, seg.y1, -seg.z1, seg.x2, seg.y2, -seg.z2)\n    return rho * (_integral(seg, px, py, pz, a_min) + _integral(img, px, py, pz, a_min)) \\\n        / (4.0 * math.pi * L)\n\n\ndef _coefs_vectorizado(A, B, L, Lp, invL, punto, rho, a_min):\n    \"\"\"Potencial en `punto` por unidad de corriente de cada segmento, con numpy.\n\n    A, B: extremos (N, 3); L: longitudes (N,); Lp: extremos imagen (A', B').\n    Devuelve un vector (N,) de coeficientes.\n    \"\"\"\n    px, py, pz = punto\n    total = None\n    for (Ai, Bi) in ((A, B), (Lp[0], Lp[1])):\n        u = (Bi - Ai) * invL[:, None]\n        w = _np.empty_like(Ai)\n        w[:, 0] = px - Ai[:, 0]\n        w[:, 1] = py - Ai[:, 1]\n        w[:, 2] = pz - Ai[:, 2]\n        t0 = (w * u).sum(axis=1)\n        d2 = (w * w).sum(axis=1) - t0 * t0\n        d = _np.sqrt(_np.maximum(d2, a_min * a_min))\n        val = _np.arcsinh((L - t0) / d) + _np.arcsinh(t0 / d)\n        total = val if total is None else total + val\n    return rho * total * invL / (4.0 * math.pi)\n\n\ndef _resolver(A, b):\n    \"\"\"Eliminacion gaussiana con pivoteo parcial (sin dependencias).\"\"\"\n    n = len(b)\n    M = [row[:] + [b[i]] for i, row in enumerate(A)]\n    for c in range(n):\n        p = max(range(c, n), key=lambda r: abs(M[r][c]))\n        if abs(M[p][c]) < 1e-14:\n            raise ValueError(\"El sistema de potenciales es singular; revisa la geometria.\")\n        M[c], M[p] = M[p], M[c]\n        piv = M[c][c]\n        for r in range(c + 1, n):\n            f = M[r][c] / piv\n            if f:\n                row_r, row_c = M[r], M[c]\n                for k in range(c, n + 1):\n                    row_r[k] -= f * row_c[k]\n    x = [0.0] * n\n    for r in range(n - 1, -1, -1):\n        s = M[r][n] - sum(M[r][k] * x[k] for k in range(r + 1, n))\n        x[r] = s / M[r][r]\n    return x\n\n\nclass ModeloPotencial:\n    \"\"\"Resuelve el reparto de corriente de fuga y evalua potenciales.\n\n    segmentos: lista de Segmento de la malla (conductores y varillas)\n    rho: resistividad del suelo [ohm*m]\n    ig: corriente total que la malla descarga al terreno [A]\n    radio_conductor: radio del conductor [m]\n    n_sub: subdivisiones por segmento. Si se omite, se eligen para llegar a unos\n           160 subsegmentos, que equilibra precision y tiempo de calculo.\n    \"\"\"\n\n    def __init__(self, segmentos, rho, ig, radio_conductor=RADIO_POR_DEFECTO,\n                 n_sub=None, largo_subsegmento=None, max_subsegmentos=1800):\n        \"\"\"largo_subsegmento: longitud objetivo de cada subsegmento [m]. La\n        precision del perfil exige subsegmentos cortos frente al espaciamiento de\n        la malla; por omision se toma la mitad del espaciamiento (ver\n        `modelo_de_malla`). max_subsegmentos acota el tamano del sistema lineal.\"\"\"\n        if not segmentos:\n            raise ValueError(\"La malla no tiene segmentos.\")\n        if rho <= 0:\n            raise ValueError(\"La resistividad debe ser positiva.\")\n        if ig <= 0:\n            raise ValueError(\"La corriente de malla debe ser positiva.\")\n        l_total = sum(s.longitud for s in segmentos)\n        if n_sub is None:\n            if largo_subsegmento is None:\n                largo_subsegmento = l_total / max(len(segmentos), 1) / 8.0\n            n_sub = max(1, math.ceil(min(s.longitud for s in segmentos) / largo_subsegmento))\n            while len(segmentos) * n_sub > max_subsegmentos and n_sub > 1:\n                n_sub -= 1\n        self.rho, self.ig, self.a = rho, ig, radio_conductor\n        self.n_sub = n_sub\n        self.subsegmentos = [s for seg in segmentos for s in seg.subdividir(n_sub)]\n        self.largo_subsegmento_medio = l_total / len(self.subsegmentos)\n        self._preparar_arreglos()\n        self._resolver_reparto()\n\n    def _preparar_arreglos(self):\n        segs = self.subsegmentos\n        if _np is None:\n            self._arr = None\n            return\n        A = _np.array([[s.x1, s.y1, s.z1] for s in segs], dtype=float)\n        B = _np.array([[s.x2, s.y2, s.z2] for s in segs], dtype=float)\n        L = _np.array([s.longitud for s in segs], dtype=float)\n        Ai = A.copy(); Ai[:, 2] *= -1.0\n        Bi = B.copy(); Bi[:, 2] *= -1.0\n        self._arr = (A, B, L, (Ai, Bi), 1.0 / L)\n\n    def _coefs(self, punto):\n        \"\"\"Coeficientes de potencial de todos los subsegmentos en un punto.\"\"\"\n        if self._arr is not None:\n            A, B, L, Lp, invL = self._arr\n            return _coefs_vectorizado(A, B, L, Lp, invL, punto, self.rho, self.a)\n        return [_coef(s, self.rho, punto[0], punto[1], punto[2], self.a)\n                for s in self.subsegmentos]\n\n    def _resolver_reparto(self):\n        n = len(self.subsegmentos)\n        centros = [s.centro for s in self.subsegmentos]\n        if _np is not None:\n            Z = _np.empty((n, n), dtype=float)\n            for i, c in enumerate(centros):\n                Z[i, :] = self._coefs(c)\n            M = _np.empty((n + 1, n + 1), dtype=float)\n            M[:n, :n] = Z\n            M[:n, n] = -1.0\n            M[n, :n] = 1.0\n            M[n, n] = 0.0\n            b = _np.zeros(n + 1, dtype=float)\n            b[n] = self.ig\n            sol = _np.linalg.solve(M, b)\n            self.corrientes = sol[:n]\n            self.gpr = float(sol[n])\n        else:  # pragma: no cover\n            Z = [self._coefs(c) for c in centros]\n            A = [list(Z[i]) + [-1.0] for i in range(n)]\n            A.append([1.0] * n + [0.0])\n            sol = _resolver(A, [0.0] * n + [self.ig])\n            self.corrientes = sol[:n]\n            self.gpr = sol[n]\n\n    # ---- resultados ---------------------------------------------------\n    @property\n    def rg(self):\n        \"\"\"Resistencia de la malla que entrega este modelo [ohm].\"\"\"\n        return self.gpr / self.ig\n\n    def potencial(self, px, py, pz=0.0):\n        \"\"\"Potencial [V] en un punto, respecto de tierra remota.\"\"\"\n        c = self._coefs((px, py, pz))\n        if self._arr is not None:\n            return float(_np.dot(c, self.corrientes))\n        return sum(ci * ii for ci, ii in zip(c, self.corrientes))\n\n    def toque(self, px, py):\n        \"\"\"Tension de toque [V]: persona de pie en (px, py) que toca metal unido\n        a la malla.  E_toque = GPR - V_superficie.\"\"\"\n        return self.gpr - self.potencial(px, py, 0.0)\n\n    def paso(self, p1, p2):\n        \"\"\"Tension de paso [V] entre dos apoyos (normalmente separados 1 m).\"\"\"\n        return abs(self.potencial(p1[0], p1[1], 0.0) - self.potencial(p2[0], p2[1], 0.0))\n\n    def perfil(self, punto_a, punto_b, n=60):\n        \"\"\"Perfil de potencial y de toque entre dos puntos de la superficie.\"\"\"\n        (xa, ya), (xb, yb) = punto_a, punto_b\n        largo = math.hypot(xb - xa, yb - ya)\n        out = []\n        for i in range(n + 1):\n            f = i / n\n            px, py = xa + (xb - xa) * f, ya + (yb - ya) * f\n            v = self.potencial(px, py, 0.0)\n            out.append({\"s\": largo * f, \"x\": px, \"y\": py, \"v\": v, \"toque\": self.gpr - v})\n        return out\n\n    def toque_maximo(self, punto_a, punto_b, n=120):\n        \"\"\"Maximo de la tension de toque en una linea. Devuelve (E, x, y).\"\"\"\n        peor = (-float(\"inf\"), None, None)\n        for p in self.perfil(punto_a, punto_b, n):\n            if p[\"toque\"] > peor[0]:\n                peor = (p[\"toque\"], p[\"x\"], p[\"y\"])\n        return peor\n\n    def potenciales(self, puntos, bloque=256):\n        \"\"\"Potencial [V] en muchos puntos a la vez.\n\n        puntos: secuencia de (x, y) o (x, y, z); z = 0 si se omite.\n        Evalua por bloques para acotar la memoria. Mucho mas rapido que llamar a\n        potencial() punto por punto, lo que permite barrer mallas de miles de\n        posiciones (por ejemplo todo el exterior del recinto).\n        \"\"\"\n        pts = [(p[0], p[1], p[2] if len(p) > 2 else 0.0) for p in puntos]\n        if _np is None:  # pragma: no cover\n            return [self.potencial(*p) for p in pts]\n        A, B, L, Lp, invL = self._arr\n        u = (B - A) * invL[:, None]\n        ui = (Lp[1] - Lp[0]) * invL[:, None]\n        out = _np.empty(len(pts), dtype=float)\n        P = _np.array(pts, dtype=float)\n        for i0 in range(0, len(pts), bloque):\n            Pb = P[i0:i0 + bloque]\n            total = None\n            for (Ai, uu) in ((A, u), (Lp[0], ui)):\n                w = Pb[:, None, :] - Ai[None, :, :]\n                t0 = (w * uu[None, :, :]).sum(axis=2)\n                d2 = (w * w).sum(axis=2) - t0 * t0\n                d = _np.sqrt(_np.maximum(d2, self.a * self.a))\n                val = _np.arcsinh((L[None, :] - t0) / d) + _np.arcsinh(t0 / d)\n                total = val if total is None else total + val\n            coef = self.rho * total * invL[None, :] / (4.0 * math.pi)\n            out[i0:i0 + bloque] = coef @ _np.asarray(self.corrientes)\n        return out\n\n    def en_escala(self, gpr_adoptado):\n        \"\"\"Devuelve los resultados en la escala de otro GPR (ver PerfilEscalado).\n\n        Usalo cuando el resto del calculo adopte una Rg distinta de la del modelo,\n        para no mezclar dos escalas de tension en la misma tabla.\n        \"\"\"\n        return PerfilEscalado(self, gpr_adoptado)\n\n    def paso_maximo(self, punto_a, punto_b, n=120, separacion=1.0):\n        \"\"\"Maxima tension de paso a lo largo de una linea, con apoyos separados\n        `separacion` metros en la direccion de la linea. Devuelve (E, x, y).\"\"\"\n        (xa, ya), (xb, yb) = punto_a, punto_b\n        largo = math.hypot(xb - xa, yb - ya)\n        if largo <= separacion:\n            raise ValueError(\"La linea debe ser mas larga que la separacion de los pies.\")\n        ux, uy = (xb - xa) / largo, (yb - ya) / largo\n        peor = (-float(\"inf\"), None, None)\n        for i in range(n + 1):\n            s = (largo - separacion) * i / n\n            x1, y1 = xa + ux * s, ya + uy * s\n            x2, y2 = x1 + ux * separacion, y1 + uy * separacion\n            e = self.paso((x1, y1), (x2, y2))\n            if e > peor[0]:\n                peor = (e, x1, y1)\n        return peor\n\n\ndef posiciones_perimetro(x0, y0, lx, ly, n):\n    \"\"\"n posiciones repartidas de forma uniforme a lo largo del perimetro.\n\n    Con n <= 4 devuelve las esquinas. Se usa para colocar las varillas cuando el\n    proyecto solo indica su cantidad.\n    \"\"\"\n    if n <= 0:\n        return []\n    esquinas = [(x0, y0), (x0 + lx, y0), (x0 + lx, y0 + ly), (x0, y0 + ly)]\n    if n <= 4:\n        return esquinas[:n]\n    per = 2.0 * (lx + ly)\n    lados = [((x0, y0), (x0 + lx, y0), lx), ((x0 + lx, y0), (x0 + lx, y0 + ly), ly),\n             ((x0 + lx, y0 + ly), (x0, y0 + ly), lx), ((x0, y0 + ly), (x0, y0), ly)]\n    out = []\n    for k in range(n):\n        s = per * k / n\n        for (a, b, largo) in lados:\n            if s <= largo or largo == 0:\n                f = s / largo if largo else 0.0\n                out.append((a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f))\n                break\n            s -= largo\n    return out\n\n\nclass PerfilEscalado:\n    \"\"\"Resultados del modelo expresados en la escala de un GPR adoptado.\n\n    El modelo entrega su propia resistencia y, con ella, su propio GPR. Si el\n    resto del calculo adopta otra Rg -- normalmente la formula cerrada de Sverak,\n    que queda del lado conservador -- las dos escalas de tension NO son\n    intercambiables: restar un potencial de superficie del modelo a un GPR de\n    Sverak da una tension de toque sin significado fisico.\n\n    Esta clase hace la conversion de una vez y para todo. El modelo aporta la\n    FORMA del perfil (que fraccion del GPR cae en cada punto) y aqui se aplica al\n    GPR adoptado:\n\n        V_escalado(P) = V_modelo(P) * (GPR_adoptado / GPR_modelo)\n        E_toque(P)    = GPR_adoptado - V_escalado(P)\n\n    Asi se cumple siempre V_escalado(P) + E_toque(P) = GPR_adoptado, y cualquier\n    tabla que mezcle columnas queda coherente.\n    \"\"\"\n\n    def __init__(self, modelo, gpr_adoptado):\n        if gpr_adoptado <= 0:\n            raise ValueError(\"El GPR adoptado debe ser positivo.\")\n        self.modelo = modelo\n        self.gpr = float(gpr_adoptado)\n        self.factor = self.gpr / modelo.gpr\n\n    @property\n    def rg(self):\n        \"\"\"Resistencia implicita en el GPR adoptado [ohm].\"\"\"\n        return self.gpr / self.modelo.ig\n\n    def potencial(self, px, py, pz=0.0):\n        return self.modelo.potencial(px, py, pz) * self.factor\n\n    def potenciales(self, puntos, bloque=256):\n        \"\"\"Potencial [V] de muchos puntos, ya en la escala adoptada.\"\"\"\n        f = self.factor\n        return [float(v) * f for v in self.modelo.potenciales(puntos, bloque)]\n\n    def toque(self, px, py):\n        return self.gpr - self.potencial(px, py, 0.0)\n\n    def paso(self, p1, p2):\n        return self.modelo.paso(p1, p2) * self.factor\n\n    def perfil(self, punto_a, punto_b, n=60):\n        out = []\n        for p in self.modelo.perfil(punto_a, punto_b, n):\n            v = p[\"v\"] * self.factor\n            out.append({\"s\": p[\"s\"], \"x\": p[\"x\"], \"y\": p[\"y\"], \"v\": v,\n                        \"toque\": self.gpr - v})\n        return out\n\n    def toque_maximo(self, punto_a, punto_b, n=120):\n        peor = (-float(\"inf\"), None, None)\n        for p in self.perfil(punto_a, punto_b, n):\n            if p[\"toque\"] > peor[0]:\n                peor = (p[\"toque\"], p[\"x\"], p[\"y\"])\n        return peor\n\n    def paso_maximo(self, punto_a, punto_b, n=120, separacion=1.0):\n        e, x, y = self.modelo.paso_maximo(punto_a, punto_b, n, separacion)\n        return e * self.factor, x, y\n\n\ndef segmentos_malla_rectangular(malla, x0=0.0, y0=0.0, varillas_xy=None):\n    \"\"\"Segmentos de una malla rectangular construida con Malla.rectangular().\n\n    La malla ocupa [x0, x0+lx] x [y0, y0+ly].\n    varillas_xy: posiciones (x, y) de las varillas; por omision, las esquinas.\n    \"\"\"\n    lx, ly, h = malla.lx, malla.ly, malla.h\n    nx, ny = malla.nx_cond, malla.ny_cond\n    if nx < 2 or ny < 2:\n        raise ValueError(\"Construye la malla con Malla.rectangular() para obtener sus segmentos.\")\n    # Los conductores se parten en los cruces: asi todos los subsegmentos miden\n    # como el espaciamiento y el refinado converge de forma monotona.\n    xs = [x0 + lx * j / (ny - 1) for j in range(ny)]\n    ys = [y0 + ly * i / (nx - 1) for i in range(nx)]\n    segs = []\n    for y in ys:  # conductores paralelos a x\n        for j in range(ny - 1):\n            segs.append(Segmento(xs[j], y, -h, xs[j + 1], y, -h))\n    for x in xs:  # conductores paralelos a y\n        for i in range(nx - 1):\n            segs.append(Segmento(x, ys[i], -h, x, ys[i + 1], -h))\n    if malla.n_varillas > 0:\n        if varillas_xy is None:\n            varillas_xy = posiciones_perimetro(x0, y0, lx, ly, malla.n_varillas)\n        for (vx, vy) in list(varillas_xy)[: malla.n_varillas]:\n            segs.append(Segmento(vx, vy, -h, vx, vy, -h - malla.l_varilla))\n    return segs\n\n\ndef modelo_de_malla(malla, rho, ig, x0=0.0, y0=0.0, varillas_xy=None, n_sub=None,\n                    largo_subsegmento=None, max_subsegmentos=1800):\n    \"\"\"Atajo: construye el modelo de potencial de una malla rectangular.\n\n    Por omision los subsegmentos miden un cuarto del espaciamiento entre\n    conductores, que es la escala a la que varia el potencial superficial. Con ese\n    refinado la tension de toque en el cerco queda a ~1 % de su valor convergido\n    (ver el estudio de convergencia en docs/VALIDACION.md).\n    \"\"\"\n    segs = segmentos_malla_rectangular(malla, x0, y0, varillas_xy)\n    if n_sub is None and largo_subsegmento is None:\n        largo_subsegmento = malla.d_sep / 4.0\n    return ModeloPotencial(segs, rho, ig, radio_conductor=malla.d / 2.0, n_sub=n_sub,\n                           largo_subsegmento=largo_subsegmento,\n                           max_subsegmentos=max_subsegmentos)\n\n\ndef tolerable_metal_metal(ts, peso=70):\n    \"\"\"Tension tolerable de toque metal-metal [V].\n\n    Persona que toca dos partes metalicas a la vez, o que esta de pie sobre metal\n    puesto a tierra: no hay resistencia del terreno en serie con los pies, por lo\n    que el limite es mucho mas bajo que el del toque convencional.\n\n        E_mm = 1000 k / sqrt(ts)\n    \"\"\"\n    k = {50: 0.116, 70: 0.157}\n    if peso not in k:\n        raise ValueError(\"El peso corporal debe ser 50 o 70 kg.\")\n    if ts <= 0:\n        raise ValueError(\"La duracion ts debe ser positiva.\")\n    return 1000.0 * k[peso] / math.sqrt(ts)\n", "suelo.py": "\"\"\"Resistividad del suelo: metodo de Wenner y modelo de dos capas (Sunde).\"\"\"\n\nimport math\n\n\ndef rho_aparente_wenner(a, resistencia, b=0.0):\n    \"\"\"Resistividad aparente [ohm*m] de una medicion Wenner.\n\n    a: separacion entre electrodos [m]; resistencia: R medida [ohm]\n    b: profundidad de enterramiento de los electrodos [m]\n       b = 0  ->  rho_a = 2 pi a R\n       b > 0  ->  formula completa de Wenner\n    \"\"\"\n    if a <= 0 or resistencia <= 0:\n        raise ValueError(\"La separacion a y la resistencia medida deben ser positivas.\")\n    if b <= 0:\n        return 2.0 * math.pi * a * resistencia\n    den = 1.0 + 2.0 * a / math.sqrt(a * a + 4.0 * b * b) - a / math.sqrt(a * a + b * b)\n    return 4.0 * math.pi * a * resistencia / den\n\n\ndef rho_aparente_dos_capas(rho1, rho2, h, a):\n    \"\"\"Resistividad aparente Wenner [ohm*m] sobre un suelo de dos capas.\n\n        rho_a = rho1 [ 1 + 4 sum_{n>=1} K^n ( 1/sqrt(1+(2nh/a)^2) - 1/sqrt(4+(2nh/a)^2) ) ]\n        K = (rho2 - rho1)/(rho2 + rho1)\n    \"\"\"\n    k = (rho2 - rho1) / (rho2 + rho1)\n    if abs(k) < 1e-12:\n        return rho1\n    suma = 0.0\n    n = 1\n    while n < 20000:\n        x = 2.0 * n * h / a\n        termino = (k**n) * (1.0 / math.sqrt(1.0 + x * x) - 1.0 / math.sqrt(4.0 + x * x))\n        suma += termino\n        if n >= 3 and abs(termino) < 1e-9 * max(1.0, abs(suma)):\n            break\n        n += 1\n    return rho1 * (1.0 + 4.0 * suma)\n\n\ndef rho_promedio(mediciones):\n    \"\"\"Promedio aritmetico de las resistividades aparentes [(a, rho_a), ...].\"\"\"\n    if not mediciones:\n        raise ValueError(\"No hay mediciones.\")\n    return sum(r for _, r in mediciones) / len(mediciones)\n\n\ndef ajustar_dos_capas(mediciones, razon_max=50.0):\n    \"\"\"Ajusta (rho1, rho2, h) a mediciones Wenner [(a, rho_a), ...].\n\n    Busqueda en malla logaritmica + refinamiento por busqueda de patron,\n    minimizando el error cuadratico de los logaritmos. El ajuste de un suelo\n    de dos capas no siempre es unico: revisar el resultado contra la curva\n    medida y el criterio del ingeniero.\n\n    Devuelve dict con rho1, rho2, h, error_rms_pct y la comparacion punto a punto.\n    \"\"\"\n    if len(mediciones) < 3:\n        raise ValueError(\"Se necesitan al menos 3 mediciones para ajustar dos capas.\")\n    datos = sorted((float(a), float(r)) for a, r in mediciones)\n    amin, amax = datos[0][0], datos[-1][0]\n    rmin = min(r for _, r in datos)\n    rmax = max(r for _, r in datos)\n    logs = [math.log(r) for _, r in datos]\n\n    def error(p):\n        r1, r2, h = math.exp(p[0]), math.exp(p[1]), math.exp(p[2])\n        razon = r2 / r1\n        if razon > razon_max or razon < 1.0 / razon_max:\n            return 1e9\n        e = 0.0\n        for (a, _), lr in zip(datos, logs):\n            e += (math.log(rho_aparente_dos_capas(r1, r2, h, a)) - lr) ** 2\n        return e\n\n    def geom(lo, hi, n):\n        return [math.exp(math.log(lo) + (math.log(hi) - math.log(lo)) * i / (n - 1)) for i in range(n)]\n\n    mejor, p_mejor = 1e18, None\n    for r1 in geom(rmin * 0.5, rmax * 1.5, 10):\n        for r2 in geom(rmin * 0.2, rmax * 5.0, 12):\n            for h in geom(amin * 0.3, amax * 2.0, 14):\n                p = (math.log(r1), math.log(r2), math.log(h))\n                e = error(p)\n                if e < mejor:\n                    mejor, p_mejor = e, p\n\n    paso = 0.3\n    p = list(p_mejor)\n    for _ in range(80):\n        mejoro = False\n        for i in range(3):\n            for s in (+paso, -paso):\n                q = list(p)\n                q[i] += s\n                e = error(q)\n                if e < mejor:\n                    mejor, p, mejoro = e, q, True\n        if not mejoro:\n            paso *= 0.5\n            if paso < 1e-4:\n                break\n\n    r1, r2, h = math.exp(p[0]), math.exp(p[1]), math.exp(p[2])\n    detalle = []\n    for a, r in datos:\n        m = rho_aparente_dos_capas(r1, r2, h, a)\n        detalle.append({\"a\": a, \"rho_medida\": r, \"rho_modelo\": m})\n    rms = math.sqrt(mejor / len(datos)) * 100.0\n    return {\"rho1\": r1, \"rho2\": r2, \"h\": h, \"error_rms_pct\": rms, \"detalle\": detalle}\n", "tolerables.py": "\"\"\"Tensiones tolerables de paso y contacto (IEEE 80).\"\"\"\n\nimport math\n\n_K = {50: 0.116, 70: 0.157}\n\n\ndef factor_cs(rho, rho_s=None, hs=0.0):\n    \"\"\"Factor de reduccion de la capa superficial Cs.\n\n        Cs = 1 - 0.09 (1 - rho/rho_s) / (2 hs + 0.09)\n\n    Sin capa superficial (rho_s None, igual a rho o hs = 0) Cs = 1.\n    \"\"\"\n    if rho <= 0:\n        raise ValueError(\"La resistividad del suelo debe ser positiva.\")\n    if rho_s is None or hs <= 0 or rho_s == rho:\n        return 1.0\n    if rho_s <= 0:\n        raise ValueError(\"La resistividad de la capa superficial debe ser positiva.\")\n    return 1.0 - 0.09 * (1.0 - rho / rho_s) / (2.0 * hs + 0.09)\n\n\ndef tensiones_tolerables(rho, ts, peso=70, rho_s=None, hs=0.0):\n    \"\"\"Devuelve (Cs, E_paso, E_contacto) en voltios.\n\n        E_paso     = (1000 + 6   Cs rho_s) k / sqrt(ts)\n        E_contacto = (1000 + 1.5 Cs rho_s) k / sqrt(ts)\n\n    k = 0.116 (peso 50 kg) o 0.157 (peso 70 kg). Sin capa superficial rho_s = rho.\n    \"\"\"\n    if ts <= 0:\n        raise ValueError(\"La duracion de la descarga ts debe ser positiva.\")\n    if peso not in _K:\n        raise ValueError(\"El peso corporal debe ser 50 o 70 kg.\")\n    cs = factor_cs(rho, rho_s, hs)\n    rs = rho if (rho_s is None or hs <= 0) else rho_s\n    k = _K[peso]\n    e_paso = (1000.0 + 6.0 * cs * rs) * k / math.sqrt(ts)\n    e_contacto = (1000.0 + 1.5 * cs * rs) * k / math.sqrt(ts)\n    return cs, e_paso, e_contacto\n"};

const $ = id => document.getElementById(id);

function pintarCampos(){
  const cont = $("campos");
  cont.innerHTML = "";
  for(const g of GRUPOS){
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<h2>${g.t}</h2>`;
    for(const c of g.campos){
      const row = document.createElement("div");
      row.className = "row" + (c.full ? " full" : "");
      if(c.grupo) row.dataset.grupo = c.grupo;
      let ctl;
      if(c.tipo==="sel") ctl = `<select id="${c.id}">${c.op.map(o=>`<option value="${o[0]}"${String(o[0])===String(c.v)?" selected":""}>${o[1]}</option>`).join("")}</select>`;
      else if(c.tipo==="area") ctl = `<textarea id="${c.id}">${c.v}</textarea>`;
      else if(c.tipo==="texto") ctl = `<input id="${c.id}" type="text" value="${c.v}">`;
      else ctl = `<input id="${c.id}" type="number" step="any" value="${c.v}">`;
      const et = `<label for="${c.id}">${c.txt}${c.u?` <span class="hint">[${c.u}]</span>`:""}${c.ayuda?`<small>${c.ayuda}</small>`:""}</label>`;
      row.innerHTML = c.full ? et + ctl : et + ctl;
      card.appendChild(row);
    }
    cont.appendChild(card);
  }
  $("suelo_modo").addEventListener("change", modoSuelo);
  modoSuelo();
}
function modoSuelo(){
  const w = $("suelo_modo").value === "wenner";
  document.querySelectorAll('[data-grupo="uni"]').forEach(e=>e.style.display = "");
  document.querySelectorAll('[data-grupo="wen"]').forEach(e=>e.style.display = w ? "" : "none");
}

  const d = {
    proyecto: $("proyecto").value,
    falla: {i_falla_ka:num("i_falla_ka"), sf:num("sf"), x_r:num("x_r"), frecuencia:num("frecuencia"), tf:num("tf"), cp:num("cp")},
    descarga: {ts:num("ts"), peso:Number($("peso").value)},
    conductor: {material:$("material").value, union:$("union").value, ta:num("ta"), diametro_mm:num("diametro_mm")},
    malla: {lx:num("lx"), ly:num("ly"), nx:num("nx"), ny:num("ny"), h:num("h"),
      varillas:{cantidad:num("v_cant")||0, largo:num("v_largo"), diametro_mm:num("v_diam"), en_perimetro:$("v_perim").value==="1"}},
    metodo_rg: $("metodo_rg").value
  };
  if($("suelo_modo").value === "wenner"){
    const filas = [];
    for(const linea of $("wenner_txt").value.split("\n")){
      const p = linea.split(/[,;\t ]+/).filter(Boolean).map(Number);
      if(p.length >= 2 && p.every(isFinite)) filas.push({a:p[0], R:p[1]});
    }
    d.suelo = {wenner: filas, b: num("wenner_b")||0};
    if(num("rho")) d.suelo.rho = num("rho");
  } else d.suelo = {rho: num("rho")};
  const rs = num("rho_s"), hs = num("hs");
  if(rs && hs) d.capa_superficial = {rho_s: rs, hs: hs};
  for(const k of Object.keys(d.falla)) if(d.falla[k]===null) delete d.falla[k];
  for(const k of Object.keys(d.descarga)) if(d.descarga[k]===null) delete d.descarga[k];
  return d;
}
function escribirDatos(d){
  const set = (id,v)=>{ if(v!==undefined && v!==null) $(id).value = v; };
  set("proyecto", d.proyecto);
  const f = d.falla||{}; for(const k of ["i_falla_ka","sf","x_r","frecuencia","tf","cp"]) set(k, f[k]);
  const de = d.descarga||{}; set("ts", de.ts); set("peso", String(de.peso||70));
  const c = d.conductor||{}; set("material", c.material); set("union", c.union); set("ta", c.ta); set("diametro_mm", c.diametro_mm);
  const m = d.malla||{}; for(const k of ["lx","ly","nx","ny","h"]) set(k, m[k]);
  const v = m.varillas||{}; set("v_cant", v.cantidad||0); set("v_largo", v.largo); set("v_diam", v.diametro_mm); set("v_perim", v.en_perimetro===false?"0":"1");
  set("metodo_rg", d.metodo_rg||"sverak");
  const s = d.suelo||{};
  if(s.wenner && s.wenner.length){
    $("suelo_modo").value = "wenner";
    $("wenner_txt").value = s.wenner.map(x=>x.a+", "+x.R).join("\n");
    set("wenner_b", s.b||0);
    $("rho").value = s.rho||"";
  } else { $("suelo_modo").value = "uniforme"; set("rho", s.rho); }
  const cs = d.capa_superficial||{}; $("rho_s").value = cs.rho_s||""; $("hs").value = cs.hs||"";
  modoSuelo();
}

const fmt = (v, dec=2) => (Math.abs(v) >= 1000 ? v.toLocaleString("es-PE",{maximumFractionDigits:1}) : v.toLocaleString("es-PE",{maximumFractionDigits:dec}));
const esc = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function pintarResultados(r){
  const R = $("resultados");
  let h = `<div class="banner ${r.cumple?"ok":"bad"}">${r.cumple?"EL DISEÑO CUMPLE":"EL DISEÑO NO CUMPLE"}${r.proyecto?` <span style="font-weight:400;font-size:14px">· ${esc(r.proyecto)}</span>`:""}</div>`;
  h += `<div class="kpis">
    <div class="kpi"><span>Rg (${r.metodo_rg==="schwarz"?"Schwarz":"Sverak"})</span><b>${fmt(r.rg_ohm,3)} Ω</b></div>
    <div class="kpi"><span>Corriente de malla IG</span><b>${fmt(r.ig_a,0)} A</b></div>
    <div class="kpi"><span>GPR</span><b>${fmt(r.gpr_v,0)} V</b></div>
    <div class="kpi"><span>Factor de decremento Df</span><b>${fmt(r.df,3)}</b></div></div>`;
  h += `<div class="card"><h2>Verificaciones</h2>`;
  for(const v of r.verificaciones){
    const pct = Math.min(100, v.valor / v.limite * 100);
    const col = v.cumple ? "var(--ok)" : "var(--bad)";
    const inv = v.nombre.startsWith("Secci");
    const pctg = inv ? Math.min(100, v.limite / v.valor * 100) : pct;
    h += `<div class="ver"><div class="top"><span>${v.nombre}: <b>${fmt(v.valor)} ${v.unidad}</b> <span class="hint">(límite ${fmt(v.limite)} ${v.unidad}; ${v.criterio})</span></span><span class="tag ${v.cumple?"ok":"bad"}">${v.cumple?"CUMPLE":"NO CUMPLE"}</span></div><div class="gauge"><i style="width:${pctg}%;background:${col}"></i></div></div>`;
  }
  h += `<p class="hint">${esc(r.nota_gpr)}</p></div>`;
  for(const a of r.advertencias) h += `<div class="warn">⚠ ${esc(a)}</div>`;
  h += `<div class="card noprint"><h2>Acciones</h2><div class="bar">
    <button id="btnBarrido">Probar más conductores (barrido)</button>
    <button id="btnMd">Descargar memoria (.md)</button>
    <button id="btnPdf">Imprimir / guardar PDF</button></div><div id="barrido"></div></div>`;
  const m = r.extra && r.extra.modelo_dos_capas;
  if(m){
    h += `<div class="card"><h2>Modelo de suelo de dos capas (informativo)</h2>
    <p class="hint">ρ1 = ${fmt(m.rho1)} Ω·m · ρ2 = ${fmt(m.rho2)} Ω·m · h = ${fmt(m.h)} m · error RMS ${fmt(m.error_rms_pct)} %. El ajuste no siempre es único: contrástalo con la curva medida.</p>
    <table><tr><th class="n">a [m]</th><th class="n">ρ medida [Ω·m]</th><th class="n">ρ modelo [Ω·m]</th></tr>${m.detalle.map(x=>`<tr><td class="n">${fmt(x.a)}</td><td class="n">${fmt(x.rho_medida)}</td><td class="n">${fmt(x.rho_modelo)}</td></tr>`).join("")}</table></div>`;
  }
  h += `<div class="card"><h2>Memoria de cálculo</h2><table><tr><th>Símbolo</th><th>Descripción</th><th class="n">Valor</th><th>Unidad</th><th>Expresión</th></tr>${r.pasos.map(p=>`<tr><td>${esc(p.simbolo)}</td><td>${esc(p.nombre)}</td><td class="n">${fmt(p.valor,4)}</td><td>${esc(p.unidad)}</td><td class="f">${esc(p.formula)}</td></tr>`).join("")}</table></div>`;
  R.innerHTML = h;
  $("btnMd").onclick = () => descargar("memoria_calculo.md", r.memoria_md, "text/markdown");
  $("btnPdf").onclick = () => window.print();
  $("btnBarrido").onclick = barrido;
}

function grafico(filas, r){
  const W = 560, H = 230, pl = 46, pr = 12, pt = 12, pb = 30;
  const xs = filas.map(f=>f.n_conductores);
  const ys = filas.flatMap(f=>[f.em,f.es]).concat([r.e_contacto_tol, r.e_paso_tol]);
  const ymax = Math.max(...ys)*1.05, x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = x => pl + (x-x0)/(x1-x0||1)*(W-pl-pr), Y = y => H-pb - y/ymax*(H-pt-pb);
  const linea = (k,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2" points="${filas.map(f=>X(f.n_conductores)+","+Y(f[k])).join(" ")}"/>`;
  const lim = (y,col)=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}" stroke="${col}" stroke-dasharray="5 4"/>`;
  let ticks = "";
  for(let i=0;i<=4;i++){ const y = ymax*i/4; ticks += `<line x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(y)+4}" text-anchor="end">${Math.round(y)}</text>`; }
  for(const x of xs) if((x-x0)%Math.max(1,Math.round((x1-x0)/8))===0) ticks += `<text x="${X(x)}" y="${H-10}" text-anchor="middle">${x}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tensiones de malla y de paso según número de conductores">${ticks}
    ${lim(r.e_contacto_tol,"#d9822b")}${lim(r.e_paso_tol,"#2b9d6b")}${linea("em","#1f5fbf")}${linea("es","#8a3ffc")}
    <text x="${pl+4}" y="${pt+8}">Em (azul), Es (violeta), límites tolerables (punteado) · eje x: n.º de conductores por lado</text></svg>`;
}

async function barrido(){
  const cont = $("barrido"); cont.innerHTML = '<p class="hint">Calculando…</p>';
  await new Promise(r=>setTimeout(r,20));
  const out = JSON.parse(py.runPython(`import tierra.api as a\na.barrido(${JSON.stringify(JSON.stringify(leerDatos()))}, 30)`));
  if(out.error){ cont.innerHTML = `<div class="warn">${esc(out.error)}</div>`; return; }
  const r = ultimo;
  const p = out.primer_n_que_cumple;
  let h = p ? `<p><b>Primera malla que cumple con geometría válida: ${p} × ${p} conductores.</b> Es una guía: confirma con el criterio de diseño y los demás datos.</p>`
            : `<p><b>Ninguna configuración cuadrada n × n (3 a 30) cumple con geometría válida.</b> Considera varillas, mayor área o capa superficial más resistiva.</p>`;
  h += grafico(out.filas, r);
  h += `<table><tr><th class="n">n × n</th><th class="n">Rg [Ω]</th><th class="n">Em [V]</th><th class="n">Es [V]</th><th>Estado</th></tr>${out.filas.map(f=>`<tr><td class="n">${f.n_conductores}</td><td class="n">${fmt(f.rg,3)}</td><td class="n">${fmt(f.em,0)}</td><td class="n">${fmt(f.es,0)}</td><td>${f.cumple?'<span class="tag ok">cumple</span>':'<span class="tag bad">no cumple</span>'}${f.valida?"":' <span class="hint">(D ≤ 2.5 m: fuera de validez)</span>'}</td></tr>`).join("")}</table>`;
  cont.innerHTML = h;
}

function descargar(nombre, texto, tipo){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texto], {type: tipo+";charset=utf-8"}));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
}

async function calcular(){
  if(!py) return;
  $("btnCalc").disabled = true; $("estado").textContent = "Calculando…";
  await new Promise(r=>setTimeout(r,20));
  try{
    const out = JSON.parse(py.runPython(`import tierra.api as a\na.calcular(${JSON.stringify(JSON.stringify(leerDatos()))})`));
    if(out.error){
      $("resultados").innerHTML = `<div class="card"><h2>No se pudo calcular</h2><div class="warn">${esc(out.error)}</div></div>`;
      $("estado").textContent = "";
    } else { ultimo = out; pintarResultados(out); $("estado").textContent = ""; }
  } catch(e){ $("estado").textContent = "Error inesperado: " + e; }
  $("btnCalc").disabled = false;
}

async function iniciar(){
  pintarCampos();
  try{
    py = await loadPyodide();
    py.FS.mkdir("/tierra_pkg"); py.FS.mkdir("/tierra_pkg/tierra");
    for(const [n, t] of Object.entries(FUENTES)) py.FS.writeFile("/tierra_pkg/tierra/"+n, t);
    py.runPython("import sys; sys.path.insert(0, '/tierra_pkg')");
    $("cargando").style.display = "none";
    calcular();
  } catch(e){
    $("cargando").innerHTML = "<div>No se pudo cargar el motor de cálculo.</div><div class='hint'>Revisa tu conexión a internet y recarga la página. Detalle: " + esc(e) + "</div>";
  }
}
$("btnCalc").onclick = calcular;
$("btnEj").onclick = () => { escribirDatos(JSON.parse(py.runPython("import tierra.api as a\na.ejemplo()"))); calcular(); };
$("btnGuardar").onclick = () => descargar("datos_malla.json", JSON.stringify(leerDatos(), null, 2), "application/json");
$("btnAbrir").onclick = () => $("archivo").click();
$("archivo").onchange = async e => { const f = e.target.files[0]; if(!f) return; try{ escribirDatos(JSON.parse(await f.text())); calcular(); }catch(err){ $("estado").textContent = "Archivo no válido: " + err; } e.target.value = ""; };
iniciar();
</script>
